name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check
      - run: pnpm package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python packages/dsh-chess-room/tests/verify-ai-pixels.py
      - run: python -m unittest discover -s packages/dsh-chess-room/tests -p test_normalize_ai_refresh.py
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Chess-Room-${{ matrix.os }}
          path: dist/DSH-Chess-Room/
